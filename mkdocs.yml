site_name: Shift Planner
site_description: Hospital shift management system — Rust backend, CP-SAT optimizer, Angular UI, and an MCP-driven chat agent.
site_url: https://uid09552.gitlab.io/shift/
repo_url: https://gitlab.com/uid09552/shift
repo_name: uid09552/shift
edit_uri: -/edit/main/docs/

docs_dir: docs

# The CI toolchain pin lives beside the sources but is not a page.
# docs/knowledge/ is the OKF bundle: consumed as files by agents, not rendered.
exclude_docs: |
  requirements.txt
  knowledge/

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/gitlab
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - User Guide:
      - guide/index.md
      - First Steps: guide/first-steps.md
      - Setting Up Your Ward: guide/setup.md
      - Managing Your Staff: guide/people.md
      - Creating a Schedule: guide/creating-a-plan.md
      - Reading the Schedule: guide/calendars.md
      - How Planning Works: guide/how-planning-works.md
      - The Assistant: guide/assistant.md
      - Troubleshooting: guide/troubleshooting.md
      - Glossary: guide/glossary.md
  - Architecture: architecture.md
  - Getting Started: getting-started.md
  - Domain Model: domain-model.md
  - Backend:
      - Service: backend.md
      - REST API: api.md
      - Database: database.md
      - Configuration: configuration.md
  - Optimizer: planner.md
  - Agent & MCP: agent.md
  - Frontend: frontend.md
  - Auth & Multi-Tenancy: auth.md
  - Deployment: deployment.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/uid09552/shift
