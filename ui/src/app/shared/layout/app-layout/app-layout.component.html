<div class="min-h-screen xl:flex">
  <div>
    <app-sidebar></app-sidebar>
    <app-backdrop></app-backdrop>
  </div>
  <!-- min-w-0: a flex item's automatic minimum size is its content's, which lets a
       wide page (the day view's Gantt chart, a monthly grid) stretch the whole
       layout and hand the browser a page-level horizontal scrollbar instead of
       letting the page's own scroll container do its job. -->
  <div
      class="min-w-0 flex-1 transition-all duration-300 ease-in-out"
      [ngClass]="{
        'xl:ml-[290px]': (isExpanded$ | async) || (isHovered$ | async),
        'xl:ml-[90px]': !(isExpanded$ | async) && !(isHovered$ | async),
        'ml-0': (isMobileOpen$ | async)
      }"
  >
    <!-- app header start -->
    <app-header/>
    <!-- app header end -->
    <div class="p-4 md:p-6">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
