<a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-999999 focus:rounded-lg focus:bg-white focus:px-4 focus:py-2 focus:text-sm focus:font-medium focus:text-brand-700 focus:shadow-theme-lg dark:focus:bg-gray-900 dark:focus:text-brand-300" (click)="skipToMain($event)">{{ 'a11y.skipToContent' | t }}</a>
<div class="min-h-screen xl:flex">
  <div>
    <app-sidebar></app-sidebar>
    <app-backdrop></app-backdrop>
  </div>
  <!-- min-w-0: a flex item's automatic minimum size is its content's, which lets a
       wide page (the day view's Gantt chart, a monthly grid) stretch the whole
       layout and hand the browser a page-level horizontal scrollbar instead of
       letting the page's own scroll container do its job. -->
  <div
      class="min-w-0 flex-1 transition-all duration-300 ease-in-out"
      [ngClass]="{
        'xl:ml-[290px]': (isExpanded$ | async) || (isHovered$ | async),
        'xl:ml-[90px]': !(isExpanded$ | async) && !(isHovered$ | async),
        'ml-0': (isMobileOpen$ | async)
      }"
  >
    <!-- app header start -->
    <app-header/>
    <!-- app header end -->
    <main id="main-content" class="p-4 md:p-6" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
<!-- Ctrl+K / ⌘K from every page -->
<app-command-palette />
