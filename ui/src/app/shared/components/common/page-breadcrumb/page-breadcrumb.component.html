<div class="flex flex-wrap items-center justify-between gap-3 mb-6">
  <h1 class="text-xl font-semibold tracking-tight text-gray-900 dark:text-white/90">
    {{ pageTitle | t }}
  </h1>
  <nav [attr.aria-label]="'common.home' | t">
    <ol class="flex items-center gap-1.5">
      <li>
        <a
          class="inline-flex items-center gap-1.5 rounded text-sm text-gray-500 transition-colors hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-200"
          routerLink="/"
        >
          {{ 'common.home' | t }}
          <svg
            class="stroke-current"
            width="17"
            height="16"
            viewBox="0 0 17 16"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M6.0765 12.667L10.2432 8.50033L6.0765 4.33366"
              stroke=""
              stroke-width="1.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
      </li>
      <li class="text-sm text-gray-800 dark:text-white/90" aria-current="page">
        {{ pageTitle | t }}
      </li>
    </ol>
  </nav>
</div>
