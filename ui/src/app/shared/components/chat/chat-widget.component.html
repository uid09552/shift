@if (!hidden) {
  <div class="fixed bottom-6 right-6 z-999 flex flex-col items-end gap-3">
    @if (open) {
      <div class="flex h-[32rem] w-[30rem] max-w-[calc(100vw-3rem)] flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-xl dark:border-gray-800 dark:bg-gray-900">
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-gray-100 px-4 py-3 dark:border-gray-800">
          <div class="flex items-center gap-2">
            <span class="flex h-8 w-8 items-center justify-center rounded-full bg-brand-50 text-brand-600 dark:bg-brand-500/15 dark:text-brand-400">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
              </svg>
            </span>
            <h3 class="text-sm font-semibold text-gray-800 dark:text-white/90">Assistant</h3>
          </div>
          <button
            type="button"
            (click)="toggle()"
            class="flex h-7 w-7 items-center justify-center rounded-full text-gray-400 transition hover:bg-gray-100 hover:text-gray-600 dark:hover:bg-white/[0.05] dark:hover:text-gray-300"
            aria-label="Close assistant"
          >
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- Messages -->
        <div class="flex-1 space-y-3 overflow-y-auto px-4 py-4">
          @if (messages.length === 0) {
            <p class="text-sm text-gray-400 dark:text-gray-500">
              Ask me to find a page, or to check or change your shift planner settings.
            </p>
          }
          @for (m of messages; track $index) {
            <div class="flex" [class.justify-end]="m.role === 'user'">
              @if (m.html) {
                <div
                  class="md-body min-w-0 max-w-[95%] rounded-2xl bg-gray-100 px-3.5 py-2 text-sm text-gray-800 dark:bg-white/[0.05] dark:text-white/90"
                  [innerHTML]="m.html"
                ></div>
              } @else {
                <div
                  class="max-w-[85%] whitespace-pre-wrap rounded-2xl px-3.5 py-2 text-sm"
                  [ngClass]="
                    m.role === 'user'
                      ? 'bg-brand-500 text-white'
                      : m.error
                        ? 'bg-error-50 text-error-600 dark:bg-error-500/15 dark:text-error-400'
                        : 'bg-gray-100 text-gray-800 dark:bg-white/[0.05] dark:text-white/90'
                  "
                >{{ m.text }}</div>
              }
            </div>
          }
          @if (sending) {
            <div class="flex">
              <div class="flex items-center gap-1 rounded-2xl bg-gray-100 px-3.5 py-2.5 dark:bg-white/[0.05]">
                <span class="h-1.5 w-1.5 animate-bounce rounded-full bg-gray-400 [animation-delay:-0.2s]"></span>
                <span class="h-1.5 w-1.5 animate-bounce rounded-full bg-gray-400 [animation-delay:-0.1s]"></span>
                <span class="h-1.5 w-1.5 animate-bounce rounded-full bg-gray-400"></span>
              </div>
            </div>
          }
          <div #scrollAnchor></div>
        </div>

        <!-- Input -->
        <div class="flex items-end gap-2 border-t border-gray-100 p-3 dark:border-gray-800">
          <textarea
            rows="1"
            placeholder="Type a message…"
            [(ngModel)]="draft"
            (keydown)="onKeydown($event)"
            class="max-h-24 flex-1 resize-none rounded-lg border border-gray-200 bg-transparent px-3 py-2 text-sm text-gray-800 outline-none focus:border-brand-300 dark:border-gray-700 dark:text-white/90 dark:focus:border-brand-500"
          ></textarea>
          <button
            type="button"
            (click)="send()"
            [disabled]="sending || !draft.trim()"
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-brand-500 text-white transition hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-40"
            aria-label="Send message"
          >
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    }

    <button
      type="button"
      (click)="toggle()"
      class="flex h-14 w-14 items-center justify-center rounded-full bg-brand-500 text-white shadow-lg transition hover:bg-brand-600"
      [attr.aria-label]="open ? 'Close assistant' : 'Open assistant'"
    >
      @if (open) {
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      } @else {
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
      }
    </button>
  </div>
}
