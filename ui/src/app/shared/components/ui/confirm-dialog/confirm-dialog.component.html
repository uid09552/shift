@if (state) {
  <div class="fixed inset-0 z-99999 flex items-center justify-center bg-black/50 backdrop-blur-[2px]" (click)="cancel()">
    <div class="mx-4 w-full max-w-sm rounded-2xl bg-white p-6 shadow-xl dark:bg-gray-900" (click)="$event.stopPropagation()">
      <div class="flex items-start gap-3">
        <div
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full"
          [class.bg-error-50]="state.danger"
          [class.dark:bg-error-500/15]="state.danger"
          [class.bg-brand-50]="!state.danger"
          [class.dark:bg-brand-500/15]="!state.danger"
        >
          @if (state.danger) {
            <svg class="h-5 w-5 text-error-600 dark:text-error-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path>
              <line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          } @else {
            <svg class="h-5 w-5 text-brand-600 dark:text-brand-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
          }
        </div>
        <div class="min-w-0 flex-1">
          @if (state.title) {
            <h3 class="text-base font-semibold text-gray-800 dark:text-white/90">{{ state.title }}</h3>
          }
          <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ state.message }}</p>
        </div>
      </div>

      <div class="mt-5 flex items-center justify-end gap-3">
        <button
          type="button"
          (click)="cancel()"
          class="rounded-lg border border-gray-200 px-4 py-2 text-sm font-medium text-gray-600 transition hover:bg-gray-50 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-white/[0.05]"
        >
          {{ state.cancelLabel || ('common.cancel' | t) }}
        </button>
        <button
          type="button"
          (click)="confirm()"
          class="rounded-lg px-4 py-2 text-sm font-medium text-white transition"
          [class.bg-error-600]="state.danger"
          [class.hover:bg-error-700]="state.danger"
          [class.bg-brand-500]="!state.danger"
          [class.hover:bg-brand-600]="!state.danger"
        >
          {{ state.confirmLabel || ('confirm.confirm' | t) }}
        </button>
      </div>
    </div>
  </div>
}
