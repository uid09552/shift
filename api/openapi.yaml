openapi: 3.0.0
info:
  title: Hospital Shift Management API
  description: API for managing hospital employee shifts, capabilities, and workstations
  version: 1.0.0
  contact:
    name: Support Team

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.example.com/api/v1
    description: Production server

tags:
  - name: Employees
    description: Employee management endpoints
  - name: Shifts
    description: Shift management endpoints
  - name: Capabilities
    description: Worker capability management endpoints
  - name: Workstations
    description: Workstation management endpoints
  - name: Unavailability
    description: Employee unavailability management endpoints
  - name: Shift Wishes
    description: Employee shift wish management endpoints (requested shift + date, considered by the optimizer)
  - name: Planner
    description: Shift scheduling planner endpoints
  - name: Shift Assignments
    description: Fixed shift assignment management endpoints
  - name: Confirmed Shift Plans
    description: Confirmed shift plan management endpoints per employee
  - name: Analysis
    description: Analysis and summary endpoints for shift planning data
  - name: Audit Logs
    description: Audit log events for user/config changes and optimizer runs

paths:
  /employees:
    get:
      tags:
        - Employees
      summary: List all employees
      operationId: listEmployees
      parameters:
        - name: limit
          in: query
          description: Maximum number of results
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Employees
      summary: Create a new employee
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Employee created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already exists
        '500':
          $ref: '#/components/responses/InternalServerError'

  /employees/template:
    get:
      tags:
        - Employees
      summary: Download an empty Excel import template for employees
      operationId: downloadEmployeeTemplate
      responses:
        '200':
          description: .xlsx template with columns name, email, max_working_hours, capabilities, available_shifts
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /employees/import:
    post:
      tags:
        - Employees
      summary: Bulk-create employees from an Excel file
      description: |
        Rows follow the columns from GET /employees/template. `capabilities` and
        `available_shifts` are comma-separated lists of existing capability/shift
        names; unmatched names are reported as warnings rather than failing the row.
      operationId: importEmployees
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /employees/{employeeId}:
    get:
      tags:
        - Employees
      summary: Get an employee by ID
      operationId: getEmployeeById
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Employee details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Employees
      summary: Update an employee
      operationId: updateEmployee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
      responses:
        '200':
          description: Employee updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Email already exists
        '500':
          $ref: '#/components/responses/InternalServerError'

  /employees/email/{email}:
    get:
      tags:
        - Employees
      summary: Get an employee by email
      operationId: getEmployeeByEmail
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Employee details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /employees/{employeeId}/capabilities:
    get:
      tags:
        - Employees
      summary: Get all capabilities of an employee
      operationId: getEmployeeCapabilities
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Capability'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Employees
      summary: Add a capability to an employee
      operationId: addEmployeeCapability
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - capability_id
              properties:
                capability_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Capability added successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Employee already has this capability
        '500':
          $ref: '#/components/responses/InternalServerError'

  /employees/{employeeId}/available-shifts:
    get:
      tags:
        - Employees
      summary: Get available shifts for an employee
      operationId: getEmployeeAvailableShifts
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of available shifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shift'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Employees
      summary: Add an available shift to an employee
      operationId: addEmployeeAvailableShift
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shift_id
              properties:
                shift_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Shift added as available
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Shift already marked as available
        '500':
          $ref: '#/components/responses/InternalServerError'

  /shifts:
    get:
      tags:
        - Shifts
      summary: List all shifts
      operationId: listShifts
      parameters:
        - name: limit
          in: query
          description: Maximum number of results
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of shifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shift'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Shifts
      summary: Create a new shift
      operationId: createShift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShiftRequest'
      responses:
        '201':
          description: Shift created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /shifts/template:
    get:
      tags:
        - Shifts
      summary: Download an empty Excel import template for shifts
      operationId: downloadShiftTemplate
      responses:
        '200':
          description: .xlsx template with columns name, short_name, color, order
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /shifts/import:
    post:
      tags:
        - Shifts
      summary: Bulk-create shifts from an Excel file
      description: |
        Rows follow the columns from GET /shifts/template. Per-weekday start/end
        times are not part of the template and must be configured afterward.
      operationId: importShifts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /shifts/{shiftId}:
    get:
      tags:
        - Shifts
      summary: Get a shift by ID
      operationId: getShiftById
      parameters:
        - name: shiftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Shift details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /shifts/{shiftId}/weekday-times:
    post:
      tags:
        - Shifts
      summary: Set start/end time for a weekday on a shift
      description: |
        Creates or updates the start_time and end_time for a specific weekday (0=Monday, 6=Sunday) on the given shift.
        If a time entry already exists for that (shiftId, weekday) pair, it will be updated.
      operationId: setShiftWeekdayTime
      parameters:
        - name: shiftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetWeekdayTimeRequest'
      responses:
        '200':
          description: Weekday time set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekdayTime'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /shifts/{shiftId}/weekday-times/{weekday}:
    delete:
      tags:
        - Shifts
      summary: Delete a weekday time entry for a shift
      operationId: deleteShiftWeekdayTime
      parameters:
        - name: shiftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: weekday
          in: path
          required: true
          description: Weekday number (0=Monday, 6=Sunday)
          schema:
            type: integer
            minimum: 0
            maximum: 6
      responses:
        '200':
          description: Weekday time deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /capabilities:
    get:
      tags:
        - Capabilities
      summary: List all capabilities
      operationId: listCapabilities
      parameters:
        - name: limit
          in: query
          description: Maximum number of results
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Capability'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Capabilities
      summary: Create a new capability
      operationId: createCapability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCapabilityRequest'
      responses:
        '201':
          description: Capability created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /capabilities/template:
    get:
      tags:
        - Capabilities
      summary: Download an empty Excel import template for capabilities
      operationId: downloadCapabilityTemplate
      responses:
        '200':
          description: .xlsx template with a single name column
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /capabilities/import:
    post:
      tags:
        - Capabilities
      summary: Bulk-create capabilities from an Excel file
      operationId: importCapabilities
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /capabilities/{capabilityId}:
    get:
      tags:
        - Capabilities
      summary: Get a capability by ID
      operationId: getCapabilityById
      parameters:
        - name: capabilityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Capability details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capability'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /workstations:
    get:
      tags:
        - Workstations
      summary: List all workstations
      operationId: listWorkstations
      parameters:
        - name: available
          in: query
          description: Filter by availability status
          schema:
            type: boolean
        - name: limit
          in: query
          description: Maximum number of results
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of workstations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workstation'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Workstations
      summary: Create a new workstation
      operationId: createWorkstation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkstationRequest'
      responses:
        '201':
          description: Workstation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workstation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /workstations/template:
    get:
      tags:
        - Workstations
      summary: Download an empty Excel import template for workstations
      operationId: downloadWorkstationTemplate
      responses:
        '200':
          description: .xlsx template with columns name, priority, min_employees, max_employees, available, active_shifts, required_capabilities
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /workstations/import:
    post:
      tags:
        - Workstations
      summary: Bulk-create workstations from an Excel file
      description: |
        Rows follow the columns from GET /workstations/template. `active_shifts`
        and `required_capabilities` are comma-separated lists of existing
        shift/capability names; unmatched names are reported as warnings rather
        than failing the row.
      operationId: importWorkstations
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /workstations/{workstationId}:
    get:
      tags:
        - Workstations
      summary: Get a workstation by ID
      operationId: getWorkstationById
      parameters:
        - name: workstationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workstation details with capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkstationDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Workstations
      summary: Update a workstation
      operationId: updateWorkstation
      parameters:
        - name: workstationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkstationRequest'
      responses:
        '200':
          description: Workstation updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workstation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /workstations/{workstationId}/availability:
    put:
      tags:
        - Workstations
      summary: Set workstation availability (full update)
      operationId: setWorkstationAvailability
      parameters:
        - name: workstationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - available
              properties:
                available:
                  type: boolean
                active_shift_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: List of active shift IDs for the workstation
      responses:
        '200':
          description: Availability updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workstation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /workstations/{workstationId}/enable:
    patch:
      tags:
        - Workstations
      summary: Enable a workstation
      description: Sets the workstation's available flag to true, making it eligible for shift assignments and optimizer scheduling.
      operationId: enableWorkstation
      parameters:
        - name: workstationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workstation enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workstation'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /workstations/{workstationId}/disable:
    patch:
      tags:
        - Workstations
      summary: Disable a workstation
      description: Sets the workstation's available flag to false, excluding it from shift assignments and optimizer scheduling without deleting it.
      operationId: disableWorkstation
      parameters:
        - name: workstationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workstation disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workstation'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /workstations/{workstationId}/required-capabilities:
    get:
      tags:
        - Workstations
      summary: Get required capabilities for a workstation
      operationId: getWorkstationRequiredCapabilities
      parameters:
        - name: workstationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of required capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Capability'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Workstations
      summary: Add a required capability to a workstation
      operationId: addWorkstationRequiredCapability
      parameters:
        - name: workstationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - capability_id
              properties:
                capability_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Capability added as required
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Capability already required for this workstation
        '500':
          $ref: '#/components/responses/InternalServerError'

  /workstations/{workstationId}/unavailabilities:
    get:
      tags:
        - Workstations
      summary: List unavailability periods for a workstation
      operationId: listWorkstationUnavailabilities
      parameters:
        - name: workstationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from_date
          in: query
          description: Filter to ranges overlapping on/after this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          description: Filter to ranges overlapping on/before this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of workstation unavailability periods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkstationUnavailability'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Workstations
      summary: Create a new workstation unavailability period
      description: |
        Marks the workstation as unavailable for planning during an inclusive date range
        (e.g. maintenance or renovation). The planner will skip assigning employees to
        this workstation for any day within the range.
      operationId: createWorkstationUnavailability
      parameters:
        - name: workstationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkstationUnavailabilityRequest'
      responses:
        '201':
          description: Workstation unavailability created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkstationUnavailability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

