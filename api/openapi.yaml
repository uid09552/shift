  /planner/optimized-shifts/{resultId}/take-as-plan:
    post:
      tags:
        - Planner
      summary: Take an optimized result as the confirmed shift plan
      description: Overwrites the confirmed shift plans for this result's planning period with its assignments and free days, optionally scoped to a subset of employees. Runs entirely server-side in one transaction (delete existing plans in the period + bulk upsert the new ones) instead of requiring the client to issue a per-employee load, per-entry delete, and per-entry create sequence of calls.
      operationId: takeOptimizedShiftAsPlan
      parameters:
        - name: resultId
          in: path
          required: true
          description: The ID of the optimized shift result to take as the confirmed plan
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                employee_ids:
                  type: array
                  description: Restrict the operation to these employees. Omit or leave empty to apply to every employee in the result.
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Confirmed shift plans replaced successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - employee_count
                  - created
                properties:
                  employee_count:
                    type: integer
                    description: Number of employees the operation was applied to
                    example: 12
                  created:
                    type: integer
                    description: Number of confirmed shift plan rows created/updated
                    example: 156
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

