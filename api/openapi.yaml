      description: Polls the status of an async optimization task. When status is "completed", result_id contains the ID of the stored OptimizedShiftResult.
      operationId: getPlanStatus
      parameters:
        - name: task_id
          in: path
          required: true
          description: The task ID returned by POST /planner/plan
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task status
          content:
