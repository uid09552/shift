#
# APISIX standalone route table for the release stack.
#
# IAM: Keycloak (Quarkus) — realm: shift  subpath: /auth
# Keycloak service name: keycloak  port: 8080  KC_HTTP_RELATIVE_PATH=/auth
#
# Gateway client credentials match the "shift-gateway" confidential client
# created by the realm import in iam/realm-shift.json.tpl.
#
# !! Values that are NOT read from .env — edit them here for production !!
#   client_secret:            must equal MCP_OAUTH_CLIENT_SECRET in .env
#   redirect_uri /
#   post_logout_redirect_uri: must be under PUBLIC_URL from .env
#   session.secret:           change it; it signs the gateway session cookies
# APISIX's standalone YAML has no environment-variable interpolation, so these
# stay literals.
#
# `discovery` is required by APISIX 3.16. lua-resty-openidc always uses the
# endpoints from the fetched discovery document (explicit endpoint fields are
# ignored for token/userinfo calls). The discovery document advertises
# ${PUBLIC_URL}/auth/... URLs (KC_HOSTNAME). APISIX is configured to ALSO
# listen on port 80 (loopback, see config-standalone.yaml), so with the
# default PUBLIC_URL=http://localhost those calls from within the container
# reach APISIX itself, which proxies /auth/* to keycloak:8080. If PUBLIC_URL
# uses a different port, add that port to node_listen as well.
#
# Security headers are set by the gateway (response-rewrite) rather than by the
# UI's nginx or the backend, so every upstream is covered by one policy. Two
# profiles are used:
#   browser  — /planner/*, /callback, /logout, /images/*: full CSP for the
#              Angular app. The app loads Google Fonts (see ui/src/index.html
#              and ui/src/styles.css), hence the fonts.googleapis.com /
#              fonts.gstatic.com entries; drop them if the fonts are ever
#              self-hosted. 'unsafe-inline' in style-src is required by
#              Angular's style bindings and the chart libraries.
#   api      — /api/*, /agent/*: JSON/SSE that must never be rendered,
#              embedded or cached, so the CSP is default-src 'none'.
# Strict-Transport-Security is ignored by browsers over plain HTTP, so it is
# safe to send on the default http://localhost deployment and takes effect as
# soon as the stack is fronted by TLS.

routes:
  # ===========================================
  # Root redirect
  # ===========================================

  - uri: /
    name: root-redirect
    priority: 5
    plugins:
      redirect:
        http_status: 302
        uri: /planner/

  # ===========================================
  # Keycloak IAM routes — no auth enforcement
  # KC_HTTP_RELATIVE_PATH=/auth means all Keycloak endpoints are under /auth.
  # A single wildcard route covers realms, admin console, resources, and JS adapter.
  #
  # Keycloak sits behind this gateway, so it only learns the browser-facing
  # scheme/host/port from the forwarded headers below. They are *set*, not
  # appended, so a client cannot spoof them. Keycloak ignores them unless
  # KC_PROXY_HEADERS=xforwarded is set (see iam/docker-compose.yml).
  #   Host             — passed through unchanged (upstream.pass_host: pass)
  #   X-Forwarded-Proto — $scheme, the scheme APISIX was reached with
  #   X-Forwarded-Host  — $http_host, i.e. host[:port] as the browser sent it
  #   X-Forwarded-Port  — the PUBLISHED port, which is not APISIX's own listen
  #                       port ($server_port is 9080/9443 inside the container
  #                       while compose publishes HTTP_PORT/HTTPS_PORT). Change
  #                       this literal when HTTP_PORT/PUBLIC_URL is not :80.
  # Keycloak's own CSP and X-Frame-Options are left alone; only the transport
  # and sniffing headers are added on top.
  # ===========================================

  - uri: /auth/*
    name: keycloak
    priority: 100
    plugins:
      proxy-rewrite:
        headers:
          set:
            X-Forwarded-Proto: "$scheme"
            X-Forwarded-Host: "$http_host"
            X-Forwarded-Port: "80"
      response-rewrite:
        headers:
          set:
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    upstream:
      type: roundrobin
      # Forward the browser's Host header so Keycloak sees the public hostname.
      pass_host: pass
      nodes:
        keycloak:8080: 1

  # ===========================================
  # Static assets — no auth, served directly from UI container
  # ===========================================

  - uri: /images/*
    name: static-images
    priority: 50
    plugins:
      response-rewrite:
        headers:
          set:
            Content-Security-Policy: "default-src 'none'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'"
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    upstream:
      type: roundrobin
      nodes:
        planner-ui:80: 1

  # ===========================================
  # Logout — clears the APISIX session then redirects to Keycloak end_session_endpoint
  # ===========================================

  - uri: /logout
    name: logout
    priority: 20
    plugins:
      openid-connect:
        client_id: shift-gateway
        client_secret: shift-gateway-secret
        discovery: http://keycloak:8080/auth/realms/shift/.well-known/openid-configuration
        scope: "openid profile email"
        bearer_only: false
        redirect_uri: http://localhost/callback
        post_logout_redirect_uri: http://localhost/
        logout_path: /logout
        ssl_verify: false
        session:
          secret: geheimgeheimgeheimgeheim12345678
      response-rewrite:
        headers:
          set:
            Clear-Site-Data: '"cache", "cookies", "storage"'
            Content-Security-Policy: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'"
            X-Content-Type-Options: nosniff
            X-Frame-Options: DENY
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
            Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    upstream:
      type: roundrobin
      nodes:
        planner-ui:80: 1

  # ===========================================
  # OIDC callback — exchanges the auth code for tokens and sets the session
  # cookie, then redirects the browser to the original destination.
  # ===========================================

  - uri: /callback
    name: oidc-callback
    priority: 20
    plugins:
      openid-connect:
        client_id: shift-gateway
        client_secret: shift-gateway-secret
        discovery: http://keycloak:8080/auth/realms/shift/.well-known/openid-configuration
        scope: "openid profile email"
        bearer_only: false
        redirect_uri: http://localhost/callback
        post_logout_redirect_uri: http://localhost/
        ssl_verify: false
        session:
          secret: geheimgeheimgeheimgeheim12345678
      response-rewrite:
        headers:
          set:
            Content-Security-Policy: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'"
            X-Content-Type-Options: nosniff
            X-Frame-Options: DENY
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
            Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    upstream:
      type: roundrobin
      nodes:
        planner-ui:80: 1

  # ===========================================
  # Protected UI routes (full OIDC via Keycloak)
  # ===========================================

  - uri: /planner/*
    name: planner-ui-oidc
    priority: 10
    plugins:
      openid-connect:
        client_id: shift-gateway
        client_secret: shift-gateway-secret
        discovery: http://keycloak:8080/auth/realms/shift/.well-known/openid-configuration
        scope: "openid profile email shift-org"
        bearer_only: false
        redirect_uri: http://localhost/callback
        post_logout_redirect_uri: http://localhost/
        ssl_verify: false
        # A session cookie alone only proves the access token was valid *at
        # login* — lua-resty-openidc checks the token's local exp claim on
        # each request but never re-contacts Keycloak while it's still
        # unexpired, so a token revoked server-side (or a session outliving a
        # short access-token lifespan) stayed "logged in" without a redirect.
        # refresh_session_interval forces a periodic round-trip to Keycloak's
        # token endpoint to catch that; renew_access_token_on_expiry +
        # access_token_expires_leeway make the redirect-to-login on actual
        # expiry happen promptly and without a race at the expiry boundary.
        renew_access_token_on_expiry: true
        access_token_expires_leeway: 30
        access_token_expires_in: 360
        refresh_session_interval: 360
        session:
          secret: geheimgeheimgeheimgeheim12345678
      response-rewrite:
        headers:
          set:
            Content-Security-Policy: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'"
            X-Content-Type-Options: nosniff
            X-Frame-Options: DENY
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
            Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    upstream:
      type: roundrobin
      nodes:
        planner-ui:80: 1

  # ===========================================
  # Protected API routes (JWT bearer via Keycloak)
  # The Angular SPA handles the OIDC flow itself and sends Bearer tokens;
  # the gateway only validates the JWT — no redirect needed.
  # ===========================================

  - uri: /api/*
    name: api-session
    priority: 10
    plugins:
      openid-connect:
        client_id: shift-gateway
        client_secret: shift-gateway-secret
        discovery: http://keycloak:8080/auth/realms/shift/.well-known/openid-configuration
        scope: "openid profile email shift-org"
        bearer_only: false
        unauth_action: deny
        ssl_verify: false
        # Caches a successful introspection result for this many seconds so
        # every API call doesn't round-trip to Keycloak — still re-validates
        # often enough to catch a revoked token promptly.
        introspection_interval: 60
        session:
          secret: geheimgeheimgeheimgeheim12345678
      response-rewrite:
        headers:
          set:
            Content-Security-Policy: "default-src 'none'; frame-ancestors 'none'; base-uri 'none'"
            X-Content-Type-Options: nosniff
            X-Frame-Options: DENY
            Referrer-Policy: no-referrer
            Cache-Control: "no-store"
            Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    upstream:
      type: roundrobin
      nodes:
        backend:8080: 1

  # ===========================================
  # Protected chat agent route (JWT bearer via Keycloak)
  # Same auth as /api/* — the openid-connect plugin sets X-Access-Token on
  # the upstream request, which the agent forwards to its own MCP tool calls
  # (see agent/shift_agent/server.py + auth.py). proxy-rewrite strips the
  # /agent prefix so the agent (which only knows about /api/v1/*) sees the
  # same paths it would locally, e.g. /agent/chat -> /api/v1/chat.
  # ===========================================

  - uri: /agent/*
    name: agent-chat
    priority: 10
    plugins:
      openid-connect:
        client_id: shift-gateway
        client_secret: shift-gateway-secret
        discovery: http://keycloak:8080/auth/realms/shift/.well-known/openid-configuration
        scope: "openid profile email shift-org"
        bearer_only: false
        unauth_action: deny
        ssl_verify: false
        introspection_interval: 60
        session:
          secret: geheimgeheimgeheimgeheim12345678
      proxy-rewrite:
        regex_uri: ["^/agent/(.*)", "/api/v1/$1"]
      # Header-only rewriting, so the SSE chat stream is not buffered.
      response-rewrite:
        headers:
          set:
            Content-Security-Policy: "default-src 'none'; frame-ancestors 'none'; base-uri 'none'"
            X-Content-Type-Options: nosniff
            X-Frame-Options: DENY
            Referrer-Policy: no-referrer
            Cache-Control: "no-store"
            Strict-Transport-Security: "max-age=31536000; includeSubDomains"
    upstream:
      type: roundrobin
      nodes:
        agent:8899: 1

#END
