# =============================================================================
# Shift — Release deployment
# =============================================================================
# Runs the published images from the GitLab container registry. Nothing is
# built here: every self-built service (backend, planner, ui, agent/mcp) is
# pulled from registry.gitlab.com/uid09552/shift/*, third-party services come
# from their upstream images.
#
# Every image reference, port, and credential is driven by the .env file next
# to this compose file — copy .env.example to .env and adjust. Agent/MCP
# runtime settings (LLM provider, API keys, MCP tool allowlist) live in a
# separate agent.env, mounted via env_file.
#
# Keycloak is NOT in this file — it is deployed separately (iam/), and only
# needs to share the "backend" / "dev_backend" networks so the gateway can
# reach it.
#
# Usage:
#   docker network create backend        # once, both networks are external
#   docker network create dev_backend
#   cp .env.example .env
#   cp agent.env.example agent.env    # then fill in the LLM API key
#   docker compose pull
#   docker compose up -d
#
# The stack is reachable through the APISIX gateway on ${HTTP_PORT} (default
# 80): / -> /planner/ (UI), /api/* (backend), /agent/* (chat agent),
# /auth/* (proxied to the separately-deployed Keycloak).
# =============================================================================

services:

  # ==========================================================================
  # Infrastructure
  # ==========================================================================

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: shift_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shift}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
      - dev_backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: ${NATS_IMAGE:-nats:2}
    container_name: shift_nats
    # JetStream and the 10MB max_payload come from the config file — the
    # 1MB default made larger planner payloads fail with "maximum payload
    # exceeded".
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  # ==========================================================================
  # IAM — Keycloak is NOT part of this stack
  # ==========================================================================
  # It is deployed separately (see iam/docker-compose.yml and the README).
  # Two things must line up for the gateway's OIDC to work:
  #   1. Keycloak must be attached to the same docker networks as this stack
  #      ("backend" / "dev_backend") and resolvable under the hostname used in
  #      gateway/apisix_conf/apisix-standalone.yaml — "keycloak:8080".
  #   2. Its issuer (KC_HOSTNAME) must be ${PUBLIC_URL}/auth, i.e. reachable
  #      through this gateway's /auth/* route.

  # ==========================================================================
  # Application services (published images)
  # ==========================================================================

  backend:
    image: ${BACKEND_IMAGE:-registry.gitlab.com/uid09552/shift/backend:latest}
    container_name: shift_backend
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    # The image's default CMD hard-codes the database URL; it is overridden
    # here so the credentials in .env are the single source of truth.
    command:
      - ./shift
      - serve
      - --listen
      - 0.0.0.0
      - --database-url
      - postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-shift}
      - --broker-host
      - nats
      - --optimizer-url
      - http://planner:5000
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  planner:
    image: ${PLANNER_IMAGE:-registry.gitlab.com/uid09552/shift/planner:latest}
    container_name: shift_planner
    depends_on:
      - nats
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  planner-ui:
    image: ${UI_IMAGE:-registry.gitlab.com/uid09552/shift/ui:latest}
    container_name: shift_planner_ui
    ports:
      - "${UI_PORT:-8082}:80"
    depends_on:
      - backend
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  # ==========================================================================
  # Agent + MCP server
  # ==========================================================================
  # Both run the same published agent image with a different command: "agent"
  # serves the chat REST API, "mcp" serves the tool server. All LLM/backend
  # settings come from agent.env (kept separate from this compose file's .env
  # so the two are never confused).

  agent:
    image: ${AGENT_IMAGE:-registry.gitlab.com/uid09552/shift/agent:latest}
    container_name: shift_agent
    command: ["shift-agent", "api", "--host", "0.0.0.0", "--port", "8899"]
    ports:
      - "${AGENT_PORT:-8899}:8899"
    env_file:
      - agent.env
    environment:
      # The agent has no backend tools of its own: it discovers and calls them
      # on the "mcp" service over streamable HTTP, forwarding the chat
      # request's access token so each call runs as the signed-in user.
      # Pinned here rather than left to agent.env because the hostname is this
      # compose file's own service name.
      MCP_SERVER_URL: http://mcp:8900/mcp
      # The documentation bundle the agent answers product, architecture and
      # how-to questions from, baked into the image by deploy/Dockerfile.agent.
      # Pinned for the same reason: it's an in-image path, not a host one.
      SHIFT_AGENT_KNOWLEDGE_PATH: /docs/knowledge
    depends_on:
      - backend
      - mcp
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  mcp:
    image: ${AGENT_IMAGE:-registry.gitlab.com/uid09552/shift/agent:latest}
    container_name: shift_mcp
    command: ["shift-agent", "mcp", "--transport", "http", "--port", "8900"]
    env_file:
      - agent.env
    environment:
      # OAuth2 client credentials for the standalone MCP server's own
      # incoming-client auth — emptied here (unlike agent.env's real values,
      # used by "agent"): the OIDC library requires an HTTPS issuer URL, which
      # MCP_BASE_URL isn't over plain HTTP. Empty does NOT mean
      # unauthenticated: the server still verifies presented bearer tokens
      # against Keycloak, it just cannot issue them via the interactive flow.
      # Put the MCP server behind HTTPS and drop these two overrides to offer
      # that flow too.
      MCP_OAUTH_CLIENT_ID: ""
      MCP_OAUTH_CLIENT_SECRET: ""
    depends_on:
      - backend
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  # ==========================================================================
  # Gateway (APISIX, standalone/YAML mode — no etcd)
  # ==========================================================================
  # The only service published to the host. Routes live in
  # gateway/apisix_conf/apisix-standalone.yaml.

  apisix:
    image: ${APISIX_IMAGE:-apache/apisix:3.16.0-debian}
    container_name: shift_apisix
    volumes:
      - ./gateway/apisix_conf/apisix-standalone.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./gateway/apisix_conf/config-standalone.yaml:/usr/local/apisix/conf/config.yaml:ro
    environment:
      - APISIX_STAND_ALONE=true
    ports:
      - "${HTTP_PORT:-80}:9080/tcp"
      - "${HTTPS_PORT:-443}:9443/tcp"
    depends_on:
      - backend
      - planner-ui
    networks:
      - backend
      - dev_backend
    restart: always

  # ==========================================================================
  # Optional tooling — started only with:  docker compose --profile tools up -d
  # ==========================================================================

networks:
  # Same networks as deploy/docker-compose.yml. Both are external — create them
  # once before the first start:
  #   docker network create backend
  #   docker network create dev_backend
  # Being external is what lets the separately-deployed Keycloak (iam/) attach
  # to them and be resolvable as "keycloak" from the gateway.
  backend:
    driver: bridge
    external:
      true
  dev_backend:
    external: true
    name: dev_backend

volumes:
  postgres_data:
  n8n_data:
