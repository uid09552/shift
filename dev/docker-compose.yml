version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: shift_postgres
    environment:
      POSTGRES_DB: shift
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped

  nats:
    image: nats:2
    container_name: shift_nats
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  postgres_data: