# Kratos configuration for development
# https://www.ory.sh/docs/kratos/configuring

version: v1.3.0

dsn: postgres://kratos:kratos@postgres:5432/kratos?sslmode=disable

serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
      allowed_origins:
        - "*"
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Content-Type
        - Accept
        - Cookie
      exposed_headers:
        - Set-Cookie
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost/
  allowed_return_urls:
    - http://localhost/*
    - http://localhost:4455/*
    - http://localhost:4200/*
  
  methods:
    password:
      enabled: true
    oidc:
      enabled: false
    totp:
      enabled: false
    lookup_secret:
      enabled: false
    webauthn:
      enabled: false
    passkey:
      enabled: false
    link:
      enabled: false
    code:
      enabled: true

  flows:
    error:
      ui_url: http://localhost:4455/error

    settings:
      ui_url: http://localhost:4455/settings
      privileged_session_max_age: 15m
      required_aal: aal1

    recovery:
      enabled: true
      ui_url: http://localhost:4455/recovery
      use: code
      after:
        default_browser_return_url: http://localhost:4455/
        hooks:
          - hook: revoke_active_sessions

    verification:
      enabled: true
      ui_url: http://localhost:4455/verification
      use: code
      after:
        default_browser_return_url: http://localhost:4455/

    logout:
      after:
        default_browser_return_url: http://localhost:4455/login

    login:
      ui_url: http://localhost:4455/login
      lifespan: 10m
      after:
        default_browser_return_url: http://localhost:4455/
        password:
          hooks:
            - hook: revoke_active_sessions

    registration:
      ui_url: http://localhost:4455/registration
      lifespan: 10m
      after:
        default_browser_return_url: http://localhost:4455/
        password:
          hooks:
            - hook: session

log:
  level: info
  format: text
  leak_sensitive_values: false

secrets:
  cookie:
    - PLEASE-CHANGE-ME-I-AM-VERY-INSECURE-32-CHARS-MIN
    - another-secret-for-rotation
  cipher:
    - dev-secret-key-exactly-32-char!!

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true
