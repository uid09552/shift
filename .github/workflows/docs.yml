# Documentation (MkDocs -> GitHub Pages). Counterpart of the `docs:build` and
# `pages` jobs in .gitlab-ci.yml.
#
# Sources live in docs/, configured by mkdocs.yml. `--strict` turns broken
# internal links and unknown config keys into build failures, so the pull
# request run catches them before the default branch publishes anything.
#
# Set it up once: Settings > Pages > Build and deployment > Source:
# "GitHub Actions".

name: Docs

on:
  # Build-only check: a broken docs build fails review instead of the deploy.
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict --site-dir site
      - name: Keep the built site (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
          retention-days: 7
      - name: Hand the site to Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time; a newer one waits rather than cancelling.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
