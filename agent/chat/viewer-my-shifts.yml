info:
  name: viewer-my-shifts
  type: http
  seq: 8

docs: |-
  Expect: As a viewer: calls getSelf, answers from their own confirmed shifts without asking who they are.

http:
  method: POST
  url: http://localhost:1111/api/v1/chat
  body:
    type: json
    data: |-
        {
          "message": "When do I work next week?",
          "session_id": "scenario-viewer-my-shifts"
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
