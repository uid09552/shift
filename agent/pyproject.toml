[project]
name = "shift-agent"
version = "0.2.0"
description = "LangGraph-based conversational agent that helps users navigate and configure the Shift Planner web app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "flask>=3.0",
    "click>=8.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastmcp>=2.3",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "pyjwt>=2.8",
    "cryptography>=41.0",
    # Reading roster files the user attaches in chat (agent/documents.py).
    # CSV needs nothing; these two cover the other two formats.
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    # Observability — inert unless OTEL_EXPORTER_OTLP_ENDPOINT is set.
    # Both exporters ship so the endpoint can be gRPC or HTTP without a rebuild.
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
    "opentelemetry-instrumentation-flask>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-instrumentation-asgi>=0.51b0",
]

[project.scripts]
shift-agent = "shift_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
