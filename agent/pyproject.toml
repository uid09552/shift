[project]
name = "shift-agent"
version = "0.2.0"
description = "LangGraph-based conversational agent that helps users navigate and configure the Shift Planner web app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "flask>=3.0",
    "click>=8.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastmcp>=2.3",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "pyjwt>=2.8",
    "cryptography>=41.0",
]

[project.scripts]
shift-agent = "shift_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
