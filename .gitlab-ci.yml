# Builds the four service images and publishes them to this project's
# container registry ($CI_REGISTRY_IMAGE), matching the names the deploy
# Makefile expects: <registry>/<component>:<tag>.
#
# Runner requirements: jobs are untagged, so any available instance runner
# picks them up. The build job uses Docker-in-Docker, which needs a runner
# with `privileged = true` in its config.toml [runners.docker] section —
# without it the dind service cannot start and `docker info` fails with
# "Cannot connect to the Docker daemon".
#
# To pin these jobs back to a specific runner, tag that runner and add the
# matching `tags:` to `.build` and `.mkdocs` below.
#
# If the runner is instead a shell executor with a mounted Docker socket,
# drop the `image:`, `services:` and the DOCKER_HOST/DOCKER_TLS_CERTDIR
# variables from `.build`.
#
# Security scanning: Trivy scans each image inside its build job, and the
# `sbom:source` jobs scan the committed lockfiles. Both emit CycloneDX SBOMs.
# A build-time scan only reflects what was known that day, so `scan:published`
# re-scans the images already in the registry on a schedule — see the block
# above that job.
#
# Dependency updates: the `renovate` job opens merge requests for new versions
# of everything the four services depend on. It runs on its own schedule
# (RENOVATE=true), and on that pipeline nothing else does — see the block above
# that job.

stages:
  - build
  - scan
  - pages
  - maintenance

variables:
  # Bumping this invalidates the cached binary (the cache key includes it).
  TRIVY_VERSION: "0.74.0"
  # Severities that count towards the gate below. The machine-readable report
  # and the SBOM always cover *all* severities regardless of this.
  SCAN_SEVERITY: "HIGH,CRITICAL"
  # 0 = report only; set to 1 (here or as a project CI variable) to make a
  # finding at SCAN_SEVERITY fail the job — for `build`, that means failing
  # before the image is pushed.
  SCAN_EXIT_CODE: "0"
  # The same gate, for scheduled re-scans only. Defaulted to 1 on purpose: a
  # nightly run that always passes tells nobody anything, and a failed
  # scheduled pipeline is what GitLab actually notifies on. It fires only on
  # fixable findings (--ignore-unfixed), i.e. ones a rebuild would resolve.
  RESCAN_EXIT_CODE: "1"
  # Deliberately *not* named TRIVY_SEVERITY / TRIVY_EXIT_CODE: Trivy reads
  # those from the environment automatically, which would silently apply the
  # gate's severity filter to the full report and SBOM as well.

workflow:
  rules:
    # Scheduled re-scans, first so they cannot be caught by the
    # $CI_OPEN_MERGE_REQUESTS rule below and dropped.
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Merge request pipelines...
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Renovate pushes a branch and then opens its merge request, and the MR
    # pipeline that follows is the one that counts. Without this the push
    # would also start a branch pipeline — four image builds for nothing.
    - if: $CI_COMMIT_BRANCH =~ /^renovate\//
      when: never
    # ...but no duplicate branch pipeline while an MR is open for it.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# The registry path both the build and the re-scan address. CI_REGISTRY_IMAGE is
# only defined when the *project's* Container Registry is enabled (Settings >
# General > Visibility). CI_REGISTRY is defined whenever the instance has one,
# so login can succeed while CI_REGISTRY_IMAGE is still empty — which silently
# produced the invalid tag "/$COMPONENT:$sha". Derive the base from CI_REGISTRY
# and the project path when it is missing, and refuse to go on if neither is
# available. Sets $IMAGE for the job that references it.
.registry-base:
  script:
    - |
      REGISTRY_BASE="${CI_REGISTRY_IMAGE:-${CI_REGISTRY:+$CI_REGISTRY/$CI_PROJECT_PATH}}"
      # Docker references must be lowercase; CI_PROJECT_PATH need not be.
      REGISTRY_BASE="$(echo "$REGISTRY_BASE" | tr '[:upper:]' '[:lower:]')"
      if [ -z "$REGISTRY_BASE" ]; then
        echo "Neither CI_REGISTRY_IMAGE nor CI_REGISTRY is set." >&2
        echo "Enable the project's Container Registry under Settings > General > Visibility." >&2
        exit 1
      fi
      export IMAGE="$REGISTRY_BASE/$COMPONENT"
      echo "Target image: $IMAGE"

.build:
  stage: build
  image: docker:29-cli
  services:
    - name: docker:29-dind
      alias: docker
  cache:
    # Two entries: the binary (invalidated by version bumps) and the
    # vulnerability database (~50 MB, pulled from ghcr.io otherwise — caching
    # it keeps the matrix jobs off the registry's rate limit).
    - key: "trivy-bin-$TRIVY_VERSION"
      paths:
        - .cache/trivy-bin
    - key: trivy-db
      paths:
        - .cache/trivy/db
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_BUILDKIT: "1"
    # The CLI and the dind service must agree on transport. Setting
    # DOCKER_TLS_CERTDIR makes dind serve TLS on 2376 only, so a client
    # pointed at plain tcp://docker:2375 gets "Cannot connect to the Docker
    # daemon at tcp://docker:2375". Both are pinned to plain TCP here so the
    # pair is self-consistent regardless of what the runner's config.toml
    # sets. To use TLS instead, set DOCKER_TLS_CERTDIR: "/certs",
    # DOCKER_HOST: tcp://docker:2376, DOCKER_TLS_VERIFY: 1 and
    # DOCKER_CERT_PATH: /certs/client.
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  # The dind service is occasionally reaped mid-pipeline ("zombie container
  # ... disconnected from network bridge"); let the runner retry those.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    # dind takes a few seconds to accept connections — probing it immediately
    # races startup, so wait rather than failing the job on the first attempt.
    - |
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        echo "Waiting for the Docker daemon at $DOCKER_HOST ($i/30)..."
        sleep 2
      done
    # Still down after ~60s: fail here, with the daemon's own diagnostics.
    - docker info >/dev/null
    # --password-stdin keeps the token out of the process list and out of
    # /root/.docker/config.json warnings.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Install the pinned Trivy release into the cached directory. docker:28-cli
    # is Alpine and ships no scanner, and the job image is already taken by the
    # Docker CLI, so the aquasec/trivy image cannot be used here.
    - |
      export TRIVY_BIN_DIR="$CI_PROJECT_DIR/.cache/trivy-bin"
      if [ ! -x "$TRIVY_BIN_DIR/trivy" ] || ! grep -qx "$TRIVY_VERSION" "$TRIVY_BIN_DIR/.version" 2>/dev/null; then
        echo "Installing Trivy $TRIVY_VERSION..."
        rm -rf "$TRIVY_BIN_DIR"
        mkdir -p "$TRIVY_BIN_DIR"
        # Downloaded to a file rather than piped into tar, so a failed fetch
        # reports itself instead of surfacing as "tar: empty archive".
        wget -q -O /tmp/trivy.tar.gz \
          "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        tar -xzf /tmp/trivy.tar.gz -C "$TRIVY_BIN_DIR"
        rm -f /tmp/trivy.tar.gz
        echo "$TRIVY_VERSION" > "$TRIVY_BIN_DIR/.version"
      fi
      # before_script and script share one shell, so this PATH reaches the
      # scan steps below.
      export PATH="$TRIVY_BIN_DIR:$PATH"
      trivy --version
  # Scheduled pipelines exist to re-scan what is already published; rebuilding
  # the same commit every night would only burn runner minutes. A Renovate run
  # only updates dependencies.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $RENOVATE == "true"
      when: never
    - when: on_success
  script:
    - !reference [.registry-base, script]
    - |
      if [ -z "$CI_REGISTRY_IMAGE" ]; then
        echo "WARNING: CI_REGISTRY_IMAGE is unset — using the derived path below." >&2
        echo "WARNING: this almost always means the project's Container Registry" >&2
        echo "WARNING: is disabled, in which case the push will be rejected with" >&2
        echo "WARNING: 'insufficient_scope: authorization failed'." >&2
        echo "WARNING: Fix: Settings > General > Visibility > Container registry." >&2
      fi
    # Warm the layer cache from the last published image; harmless if absent.
    - docker pull "$IMAGE:latest" || true
    # What the image reports as its version (GET /api/v1/info, the UI's
    # sidebar, the planner's and agent's health). A tag pipeline publishes the
    # tag; anything else is "<branch>-<short sha>". A project CI variable
    # APP_VERSION overrides both — e.g. for a release built from a branch.
    - |
      if [ -z "$APP_VERSION" ]; then
        APP_VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}}"
      fi
      BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      echo "Version: $APP_VERSION ($CI_COMMIT_SHA, built $BUILD_DATE)"
    # The Dockerfiles COPY from the repo root (e.g. `COPY ui/ .`), so the
    # build context is the root, not deploy/.
    - |
      docker build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --build-arg APP_VERSION="$APP_VERSION" \
        --build-arg GIT_COMMIT="$CI_COMMIT_SHA" \
        --build-arg BUILD_DATE="$BUILD_DATE" \
        --label org.opencontainers.image.version="$APP_VERSION" \
        --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        --label org.opencontainers.image.created="$BUILD_DATE" \
        --label org.opencontainers.image.source="$CI_PROJECT_URL" \
        --cache-from "$IMAGE:latest" \
        -f "deploy/Dockerfile.$COMPONENT" \
        -t "$IMAGE:$CI_COMMIT_SHORT_SHA" \
        .
    # ---- Trivy: scan and SBOM -------------------------------------------
    # This runs inside the build job rather than a separate `scan` job on
    # purpose: merge request pipelines never push, so the image exists only in
    # this job's dind daemon. Shipping it to another job would mean a
    # `docker save` tarball artifact of a few hundred MB per component.
    # It runs *before* the push so an enabled gate (SCAN_EXIT_CODE=1) keeps a
    # failing image out of the registry.
    - mkdir -p security
    # Full report, all severities, in GitLab's container-scanning schema.
    # gitlab.tpl ships in the release tarball. `--image-src docker` pins Trivy
    # to the dind daemon (it reads DOCKER_HOST) — without it, a daemon lookup
    # failure falls through to `remote` and scans whatever the registry holds.
    - |
      trivy image \
        --scanners vuln \
        --cache-dir "$CI_PROJECT_DIR/.cache/trivy" \
        --no-progress \
        --image-src docker \
        --format template \
        --template "@$TRIVY_BIN_DIR/contrib/gitlab.tpl" \
        --output "security/gl-container-scanning-report.json" \
        "$IMAGE:$CI_COMMIT_SHORT_SHA"
    # CycloneDX SBOM of the image: OS packages plus whatever language
    # manifests survive into the runtime stage. The Rust backend's crates are
    # *not* among them (the final stage holds only the compiled binary) — the
    # sbom:source jobs cover dependencies from the lockfiles instead.
    - |
      trivy image \
        --cache-dir "$CI_PROJECT_DIR/.cache/trivy" \
        --no-progress \
        --image-src docker \
        --format cyclonedx \
        --output "security/gl-sbom-image-$COMPONENT.cdx.json" \
        "$IMAGE:$CI_COMMIT_SHORT_SHA"
    # Human-readable summary, and the gate. --ignore-unfixed keeps the gate on
    # findings that a base-image bump can actually resolve.
    - |
      trivy image \
        --scanners vuln \
        --cache-dir "$CI_PROJECT_DIR/.cache/trivy" \
        --no-progress \
        --image-src docker \
        --severity "$SCAN_SEVERITY" \
        --ignore-unfixed \
        --exit-code "$SCAN_EXIT_CODE" \
        "$IMAGE:$CI_COMMIT_SHORT_SHA"
    # ---------------------------------------------------------------------
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        echo "Merge request pipeline — image built but not published."
        exit 0
      fi
      docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$CI_COMMIT_TAG"
        docker push "$IMAGE:$CI_COMMIT_TAG"
      fi
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi
  artifacts:
    # `when: always` so a failing gate still publishes the evidence.
    when: always
    expire_in: 1 month
    paths:
      - security/
    reports:
      # Rendered in the MR security widget and the vulnerability report
      # (GitLab Ultimate); on other tiers the files remain as plain artifacts.
      container_scanning: security/gl-container-scanning-report.json
      cyclonedx: security/gl-sbom-*.cdx.json

build:
  extends: .build
  parallel:
    matrix:
      # "mcp" deliberately absent: it runs the agent image with a different
      # command (see deploy/docker-compose.yml).
      - COMPONENT:
          - backend
          - planner
          - ui
          - agent

# ---------------------------------------------------------------------------
# Source SBOM + dependency scan
#
# Complements the image SBOM produced by `build`: this reads the committed
# lockfiles (Cargo.lock, ui/package-lock.json, planner/uv.lock, agent/uv.lock),
# which is the only place the backend's crates and the UI's npm tree appear —
# the multi-stage Dockerfiles leave them behind in the builder stage.
#
# `needs: []` starts these immediately instead of waiting for the build stage;
# they do not use the built images.
# ---------------------------------------------------------------------------

sbom:source:
  stage: scan
  needs: []
  image:
    name: "aquasec/trivy:$TRIVY_VERSION"
    # The image's ENTRYPOINT is trivy itself, which GitLab would use to run
    # the shell — clear it so `script:` executes normally.
    entrypoint: [""]
  cache:
    - key: trivy-db
      paths:
        - .cache/trivy/db
  parallel:
    matrix:
      # The backend is the repo root, so it has to exclude the other three.
      - COMPONENT: backend
        SOURCE_PATH: "."
        SKIP_DIRS: "ui,planner,agent,target,site,public,.cache,deploy"
      - COMPONENT: ui
        SOURCE_PATH: "ui"
        SKIP_DIRS: "node_modules,dist"
      - COMPONENT: planner
        SOURCE_PATH: "planner"
        SKIP_DIRS: ".venv"
      - COMPONENT: agent
        SOURCE_PATH: "agent"
        SKIP_DIRS: ".venv"
  rules:
    # A Renovate run changes no lockfile of its own; its merge requests get
    # this job in their own pipelines.
    - if: $RENOVATE == "true"
      when: never
    - when: on_success
  script:
    - mkdir -p security
    # On a schedule this job is a re-scan: the lockfiles have not changed, the
    # vulnerability database has. Reporting silently would defeat the point, so
    # scheduled runs use the stricter gate.
    - |
      GATE_EXIT_CODE="$SCAN_EXIT_CODE"
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ]; then
        GATE_EXIT_CODE="$RESCAN_EXIT_CODE"
        echo "Scheduled re-scan: failing on $SCAN_SEVERITY findings (exit code $GATE_EXIT_CODE)."
      fi
    - |
      trivy fs \
        --cache-dir "$CI_PROJECT_DIR/.cache/trivy" \
        --no-progress \
        --skip-dirs "$SKIP_DIRS" \
        --format cyclonedx \
        --output "security/gl-sbom-source-$COMPONENT.cdx.json" \
        "$SOURCE_PATH"
    # Vulnerabilities in those same dependencies. Shares SCAN_EXIT_CODE with
    # the image gate: 0 reports, 1 fails the job.
    - |
      trivy fs \
        --scanners vuln \
        --cache-dir "$CI_PROJECT_DIR/.cache/trivy" \
        --no-progress \
        --skip-dirs "$SKIP_DIRS" \
        --severity "$SCAN_SEVERITY" \
        --exit-code "$GATE_EXIT_CODE" \
        "$SOURCE_PATH"
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - security/
    reports:
      cyclonedx: security/gl-sbom-*.cdx.json

# ---------------------------------------------------------------------------
# Scheduled re-scan of the published images
#
# A build-time scan only knows the CVEs that existed the day it ran. An image
# that passed last week can be vulnerable today without a single line of code
# changing — so this re-scans what is *already in the registry*, on a schedule,
# and fails when something fixable has appeared.
#
# It does not rebuild and needs no Docker daemon: Trivy reads the image straight
# out of the registry over the API, which is why this job uses the aquasec/trivy
# image rather than the dind-based `.build`. No SBOM is emitted either — the
# image has not changed, so it would be byte-for-byte the one `build` already
# published; only the vulnerability database moved.
#
# Set it up once: Build > Pipeline schedules > New schedule (e.g. `0 3 * * *`)
# on the default branch. GitLab notifies the schedule's owner when a scheduled
# pipeline fails, which is the whole delivery mechanism here.
#
# It can also be started by hand from the default branch, for when a CVE lands
# in the news and waiting for 3am is not good enough.
# ---------------------------------------------------------------------------

scan:published:
  stage: scan
  needs: []
  image:
    name: "aquasec/trivy:$TRIVY_VERSION"
    # The image's ENTRYPOINT is trivy itself, which GitLab would use to run the
    # shell — clear it so `script:` executes normally.
    entrypoint: [""]
  cache:
    - key: trivy-db
      paths:
        - .cache/trivy/db
  variables:
    # Registry credentials for Trivy's remote image fetch. Passed through the
    # environment on purpose — the names Trivy reads by itself — so the token
    # never lands on a command line and into the job log. (Contrast the note on
    # TRIVY_SEVERITY at the top: there the automatic pickup is the hazard, here
    # it is the point.)
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  parallel:
    matrix:
      - COMPONENT:
          - backend
          - planner
          - ui
          - agent
  rules:
    # Renovate has a schedule of its own; that one is not a re-scan.
    - if: $RENOVATE == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # A button on the default branch. `allow_failure` so an ad-hoc re-scan
    # reports without turning the branch's pipeline red.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - !reference [.registry-base, script]
    - mkdir -p security
    # `:latest` is what the default branch publishes, i.e. what a deployment
    # following deploy/Makefile actually runs.
    - |
      TARGET="$IMAGE:${RESCAN_TAG:-latest}"
      echo "Re-scanning $TARGET (built $(date -u +%F) or earlier) against today's database."
    # Full report, all severities, in GitLab's container-scanning schema. The
    # official image keeps the contrib templates at /contrib.
    - |
      trivy image \
        --scanners vuln \
        --cache-dir "$CI_PROJECT_DIR/.cache/trivy" \
        --no-progress \
        --format template \
        --template "@/contrib/gitlab.tpl" \
        --output "security/gl-container-scanning-report.json" \
        "$TARGET"
    # Human-readable summary, and the gate. --ignore-unfixed keeps it to
    # findings a rebuild on a newer base image would actually resolve.
    - |
      trivy image \
        --scanners vuln \
        --cache-dir "$CI_PROJECT_DIR/.cache/trivy" \
        --no-progress \
        --severity "$SCAN_SEVERITY" \
        --ignore-unfixed \
        --exit-code "$RESCAN_EXIT_CODE" \
        "$TARGET"
  artifacts:
    # `when: always` so the evidence survives the failure that is the point.
    when: always
    expire_in: 1 month
    paths:
      - security/
    reports:
      container_scanning: security/gl-container-scanning-report.json

# ---------------------------------------------------------------------------
# Documentation (MkDocs -> GitLab Pages)
#
# Sources live in docs/, configured by mkdocs.yml. `--strict` turns broken
# internal links and unknown config keys into build failures, so the MR job
# below catches them before the default branch publishes anything.
# ---------------------------------------------------------------------------

.mkdocs:
  stage: pages
  image: python:3.14-slim
  before_script:
    - pip install --no-cache-dir -r docs/requirements.txt
  cache:
    key:
      files:
        - docs/requirements.txt
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Build-only check: a broken docs build fails review instead of the deploy.
docs:build:
  extends: .mkdocs
  script:
    - mkdocs build --strict --site-dir site
  artifacts:
    paths:
      - site
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docs/**/*
        - mkdocs.yml

# GitLab Pages expects a job named "pages" publishing a "public" artifact.
pages:
  extends: .mkdocs
  script:
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  rules:
    # Nothing to republish on a scheduled re-scan or a Renovate run.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $RENOVATE == "true"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Renovate — dependency update merge requests
#
# Runs Renovate against this project. It reads renovate.json5 (what to update
# and how to bundle it) and opens a merge request per update or bundle: the
# backend's crates, the UI's npm packages, the planner's and agent's Python
# packages (uv.lock included), the docs and e2e requirements, the Dockerfile
# and Compose images, and the images and TRIVY_VERSION in this file — its own
# image among them. Each merge request gets the ordinary MR pipeline, so all
# four images are built and scanned before anyone merges. Nothing is merged
# automatically.
#
# It has a schedule of its own, told apart from the nightly re-scan by a
# variable: when RENOVATE is "true" only this job runs, and it runs at no
# other time.
#
# Set it up once:
#   1. Settings > Access tokens > Add new token (a project access token):
#      role Developer, scopes `api` and `write_repository`. Renovate pushes
#      renovate/* branches and opens merge requests as that token's bot user.
#      Project tokens expire (a year at most) — renew it before then, or this
#      job fails with 401 Unauthorized.
#   2. Settings > CI/CD > Variables: RENOVATE_TOKEN = that token; masked and
#      protected (the schedule runs on the protected default branch).
#   3. Recommended: GITHUB_COM_TOKEN = a GitHub token with no scopes at all.
#      Renovate uses it to put release notes into the merge requests and to
#      stay under github.com's anonymous rate limit, which one run exceeds.
#   4. Build > Pipeline schedules > New schedule: e.g. `0 5 * * 1-5`,
#      Europe/Berlin, the default branch, variable RENOVATE = true.
#   5. Keep Issues enabled. Renovate keeps a "Dependency Dashboard" issue
#      listing every pending update; ticking one there makes the next run open
#      it — that is also how a PostgreSQL or Keycloak major gets approved.
#
# To run it now: Build > Pipelines > Run pipeline, default branch, variable
# RENOVATE = true. The job log says what it did; the debug log is an artifact.
#
# Check renovate.json5 before committing a change to it:
#   docker run --rm -v "$PWD/renovate.json5:/usr/src/app/renovate.json5:ro" \
#     ghcr.io/renovatebot/renovate:44.93.0 renovate-config-validator --strict
# ---------------------------------------------------------------------------

renovate:
  stage: maintenance
  needs: []
  image: ghcr.io/renovatebot/renovate:44.105.1
  # Two runs at once would race on the same branches.
  resource_group: renovate
  timeout: 1h
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "$CI_API_V4_URL"
    # This project only, not every project the token can reach.
    RENOVATE_REPOSITORIES: "$CI_PROJECT_PATH"
    # renovate.json5 is committed, so there is nothing to onboard — and if it
    # were ever removed, Renovate should stop rather than fall back to defaults.
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    # Cargo, npm and uv are installed on demand, at the versions the manifests
    # ask for, to regenerate Cargo.lock, package-lock.json and uv.lock.
    RENOVATE_BINARY_SOURCE: install
    RENOVATE_BASE_DIR: "$CI_PROJECT_DIR/.cache/renovate"
    # Remembers what each branch was built from, so an unchanged run is quick.
    RENOVATE_REPOSITORY_CACHE: enabled
    LOG_LEVEL: info
    RENOVATE_LOG_FILE: renovate-log.ndjson
    RENOVATE_LOG_FILE_LEVEL: debug
  cache:
    key: renovate
    paths:
      - .cache/renovate/cache/renovate/repository/
  rules:
    - if: $RENOVATE == "true" && $CI_PIPELINE_SOURCE =~ /^(schedule|web)$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      if [ -z "$RENOVATE_TOKEN" ]; then
        echo "RENOVATE_TOKEN is not set (or not available on this branch)." >&2
        echo "See the setup notes above the renovate job in .gitlab-ci.yml." >&2
        exit 1
      fi
    - renovate
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - renovate-log.ndjson
