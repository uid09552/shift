[package]
name = "shift"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
# Add other dependencies as needed
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
env_logger = "0.10"
thiserror = "1.0"
axum = { version = "0.7", features = ["multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
figment = { version = "0.10", features = ["env", "yaml"] }
url = "2"

# Database
diesel = { version = "2.1", features = ["postgres", "r2d2", "chrono", "uuid", "serde_json"] }
diesel_migrations = "2.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
r2d2 = "0.8"

# Message broker
async-nats = "0.38"

# HTTP client. Kept on the same version as opentelemetry-otlp's own client
# (0.13) and with TLS enabled deliberately: otlp pulls reqwest in with
# default-features off and only "blocking", i.e. *no* TLS backend, so an https
# OTLP endpoint fails instantly with "error sending request". Cargo unions the
# features, so declaring them here is what gives that exporter working TLS.
# "query" and "form" are for the Keycloak admin client (services/keycloak.rs):
# query parameters on the admin API, and the client-credentials token request.
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "rustls", "http2", "query", "form"] }
base64 = "0.22"
futures-util = "0.3.32"
rust_xlsxwriter = "0.96.0"
calamine = "0.36.0"
# Observability (OpenTelemetry traces + metrics over OTLP, off unless configured)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "tls", "tls-roots", "tls-webpki-roots", "http-proto", "reqwest-blocking-client", "trace", "metrics", "internal-logs"] }
opentelemetry-semantic-conventions = "0.32"
opentelemetry-http = "0.32"


[dev-dependencies]
tower-test = "0.4"
