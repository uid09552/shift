[project]
name = "shift-planner"
version = "1.0.0"
description = "Constraint-based employee shift scheduling with OR-Tools CP-SAT solver"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "ortools>=9.8",
    "click>=8.0",
    "nats-py>=2.2.0",
    "pydantic>=2.0",
    "flask>=3.0",
    # Observability — inert unless OTEL_EXPORTER_OTLP_ENDPOINT is set.
    # Both exporters ship so the endpoint can be gRPC or HTTP without a rebuild.
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
    "opentelemetry-instrumentation-flask>=0.51b0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
shift-planner = "shift_planner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
