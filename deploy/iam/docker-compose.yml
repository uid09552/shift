# Keycloak IAM - Standalone deployment with PostgreSQL (Quarkus-based)
#
# Usage:
#   docker-compose up -d
#
# On first start Keycloak imports realm-shift.json which creates:
#   - Realm:           shift
#   - Client (SPA):    shift-web       — public PKCE client for Angular
#   - Client (GW):     shift-gateway   — confidential client for APISIX
#   - User:            admin / admin
#
# Admin UI:   http://localhost/auth/admin/
# Admin user: admin / admin
# Realm UI:   http://localhost/auth/realms/shift/account

services:

  keycloak-db:
    image: postgres:17-alpine
    container_name: shift_keycloak_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - backend
      - dev_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: shift_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: "http://localhost/auth"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      # Keycloak only trusts X-Forwarded-Proto/-Host/-Port when told to. The
      # gateway sets (never appends) them on /auth/*, so they cannot be spoofed
      # by a client — see deploy/gateway/apisix_conf/apisix-standalone.yaml.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: info
      KC_FEATURES: organization
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-shift-gateway-secret}
    volumes:
      - ./realm-shift.json.tpl:/opt/keycloak/data/import/realm-shift.json.tpl:ro
      - ./docker-entrypoint.sh:/docker-entrypoint-wrapper.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-wrapper.sh"]
    ports:
      - "8080:8080"
      - "9000:9000"
    networks:
      - backend
      - dev_backend
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # Health is served on the management port (9000), unaffected by KC_HTTP_RELATIVE_PATH
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

networks:
  backend:
    driver: bridge
    external:
      true
  dev_backend:
    name: dev_backend

volumes:
  keycloak_db_data:
