# NATS server configuration for the shift stack.
#
# Mounted read-only at /etc/nats/nats.conf and loaded with
#   nats-server -c /etc/nats/nats.conf
# (replaces the previous bare "-js" command line, JetStream is enabled below).

# Largest single message the server accepts. The default is 1MB, which the
# planner requests / optimizer results exceed for bigger planning periods
# ("maximum payload exceeded" from the client). Clients learn this value from
# the server INFO on connect, so no client-side setting has to match it.
max_payload: 10MB

# JetStream — used for the asynchronous scheduling tasks (SCHEDULING stream).
# store_dir is intentionally left at the default (/tmp/nats/jetstream), which
# is what the "-js" flag used before; set it and add a volume if the stream
# needs to survive container recreation.
jetstream {}

# Monitoring endpoint (/varz, /healthz, ...) on the published port 8222.
http_port: 8222
