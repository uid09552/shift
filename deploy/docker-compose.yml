# Shift Backend - Complete deployment configuration
# Includes: Backend API, Planner, UI, Gateway (APISIX)
#
# Usage:
#   docker-compose up -d
#   make up

services:

  # ==========================================================================
  # Infrastructure Services
  # ==========================================================================

  postgres:
    image: postgres:17-alpine
    container_name: shift_postgres
    environment:
      POSTGRES_DB: shift
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
      - dev_backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2
    container_name: shift_nats
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  # ==========================================================================
  # Backend Services
  # ==========================================================================

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: shift_deploy_backend
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  planner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.planner
    container_name: shift_deploy_planner
    ports:
      - "5000:5000"
    depends_on:
      - nats
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  planner-ui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui
    container_name: shift_planner_ui
    ports:
      - "8888:80"
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  # ==========================================================================
  # Gateway (APISIX)
  # ==========================================================================

  apisix:
    image: apache/apisix:3.16.0-debian
    container_name: shift_apisix
    restart: always
    volumes:
      - ./gateway/apisix_conf/apisix-standalone.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./gateway/apisix_conf/config-standalone.yaml:/usr/local/apisix/conf/config.yaml:ro
    environment:
      - APISIX_STAND_ALONE=true
    ports:
      - "9180:9180/tcp"
      - "80:9080/tcp"
      - "9091:9091/tcp"
      - "443:9443/tcp"
      - "9092:9092/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
      - dev_backend

networks:
  backend:
    driver: bridge
    external:
      true
  dev_backend:
    external: true
    name: dev_backend
volumes:
  postgres_data:
