# Shift Backend - Complete deployment configuration
# Includes: Backend API, Planner, Agent, UI, Gateway (APISIX)
#
# Usage:
#   docker-compose up -d
#   make up

services:

  # ==========================================================================
  # Infrastructure Services
  # ==========================================================================

  postgres:
    image: postgres:18-alpine
    container_name: shift_postgres
    environment:
      POSTGRES_DB: shift
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
      - dev_backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2
    container_name: shift_nats
    # JetStream and the 10MB max_payload come from the config file — the
    # 1MB default made larger planner payloads fail with "maximum payload
    # exceeded".
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  # ==========================================================================
  # Backend Services
  # ==========================================================================

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        APP_VERSION: ${APP_VERSION:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: shift-backend:local
    container_name: shift_deploy_backend
    environment:
      # OpenTelemetry. Set OTEL_EXPORTER_OTLP_ENDPOINT in deploy/.env to turn
      # tracing and metrics on; leaving it empty keeps them off. See
      # docs/observability.md.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: shift-backend
      CI_PROJECT_ID: ${CI_PROJECT_ID:-}
      CI_PROJECT_NAME: ${CI_PROJECT_NAME:-shift}
      CI_COMMIT_SHA: ${CI_COMMIT_SHA:-}
      CI_ENVIRONMENT_NAME: ${CI_ENVIRONMENT_NAME:-}
      # Keycloak admin connection for the user-management endpoints. Reached by
      # container name, so it works whether or not the gateway is up.
      SHIFT_KEYCLOAK__URL: ${SHIFT_KEYCLOAK__URL:-http://keycloak:8080/auth}
      SHIFT_KEYCLOAK__REALM: ${SHIFT_KEYCLOAK__REALM:-shift}
      SHIFT_KEYCLOAK__CLIENT_ID: ${SHIFT_KEYCLOAK__CLIENT_ID:-shift-gateway}
      SHIFT_KEYCLOAK__CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-shift-gateway-secret}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  planner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.planner
      args:
        APP_VERSION: ${APP_VERSION:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: shift-planner:local
    container_name: shift_deploy_planner
    environment:
      # Same OTLP endpoint as the backend; the traceparent the backend puts in
      # the NATS payload makes a solve show up under the request that asked
      # for it. See docs/observability.md.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: shift-planner
      CI_PROJECT_ID: ${CI_PROJECT_ID:-}
      CI_PROJECT_NAME: ${CI_PROJECT_NAME:-shift}
      CI_COMMIT_SHA: ${CI_COMMIT_SHA:-}
      CI_ENVIRONMENT_NAME: ${CI_ENVIRONMENT_NAME:-}
    depends_on:
      - nats
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  # The same optimizer image, serving its REST API instead of subscribing to
  # NATS. The backend plans through the queue above; this is what the MCP
  # server's `optimizeSchedule` tool calls, which has to wait for its answer
  # and so cannot go through a queue. Not published to the host — only the
  # compose network needs it.
  planner-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.planner
      args:
        APP_VERSION: ${APP_VERSION:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: shift-planner:local
    container_name: shift_deploy_planner_api
    command: ["python", "-m", "shift_planner", "api", "--host", "0.0.0.0", "--port", "8888"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: shift-planner-api
      CI_PROJECT_ID: ${CI_PROJECT_ID:-}
      CI_PROJECT_NAME: ${CI_PROJECT_NAME:-shift}
      CI_COMMIT_SHA: ${CI_COMMIT_SHA:-}
      CI_ENVIRONMENT_NAME: ${CI_ENVIRONMENT_NAME:-}
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  planner-ui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui
      args:
        APP_VERSION: ${APP_VERSION:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: shift-ui:local
    container_name: shift_planner_ui
    ports:
      - "8888:80"
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  # ==========================================================================
  # Agent Service
  # ==========================================================================

  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
      args:
        APP_VERSION: ${APP_VERSION:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: shift-agent:local
    container_name: shift_deploy_agent
    command: ["shift-agent", "api", "--host", "0.0.0.0", "--port", "8899"]
    # All settings (OPENAI_API_KEY, BACKEND_API_URL, KEYCLOAK_REALM_URL,
    # MCP_OAUTH_CLIENT_ID/SECRET, SHIFT_AGENT_MODEL, MCP_TOOLS, ...) come from
    # .env — see .env.example for the full list and docs.
    env_file:
      - .env
    environment:
      # The agent has no backend tools of its own: it discovers and calls them
      # on the "mcp" service below over streamable HTTP, forwarding the chat
      # request's access token so each call runs as the signed-in user.
      # Pinned here rather than left to .env because the hostname is this
      # compose file's own service name.
      MCP_SERVER_URL: http://mcp:8900/mcp
      # The documentation bundle the agent answers product, architecture and
      # how-to questions from, copied into the image by Dockerfile.agent.
      # Pinned for the same reason: it's an in-image path, not a host one.
      SHIFT_AGENT_KNOWLEDGE_PATH: /docs/knowledge
      # OTLP endpoint and headers come from .env with everything else; only
      # the service name is per-service. See docs/observability.md.
      OTEL_SERVICE_NAME: shift-agent
    ports:
      - "8899:8899"
    depends_on:
      - backend
      - mcp
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
      args:
        APP_VERSION: ${APP_VERSION:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}
    # Same Dockerfile/context as "agent" — same image content, just a
    # different CMD override below. Reuses the "agent" image name/tag rather
    # than publishing a separate one under the registry.
    image: shift-agent:local
    container_name: shift_deploy_mcp
    command: ["shift-agent", "mcp", "--transport", "http", "--port", "8900"]
    env_file:
      - .env
    environment:
      # OAuth2 client credentials for the standalone MCP server's own
      # incoming-client auth — overridden to empty here (unlike .env's real
      # values, used by "agent"): the OIDC library requires an HTTPS issuer
      # URL, which MCP_BASE_URL isn't (see shift_agent/mcp/server.py's
      # _build_auth). Empty does NOT mean unauthenticated: the server still
      # verifies presented bearer tokens against Keycloak, it just cannot
      # issue them via the interactive flow. Set both and put mcp behind
      # HTTPS to offer that flow too.
      MCP_OAUTH_CLIENT_ID: ""
      MCP_OAUTH_CLIENT_SECRET: ""
      # The optimizer's synchronous REST API, behind the `optimizeSchedule`
      # tool. Pinned here rather than left to .env because the hostname is
      # this compose file's own service name.
      OPTIMIZER_URL: http://planner-api:8888
      # Reported separately from the agent so the two show up as distinct
      # services in the trace. See docs/observability.md.
      OTEL_SERVICE_NAME: shift-mcp
    ports:
      - "8900:8900"
    depends_on:
      - backend
      - planner-api
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  # ==========================================================================
  # n8n - Workflow automation (replaces Flowise)
  # ==========================================================================

  n8n:
    image: n8nio/n8n:latest
    container_name: shift_n8n
    environment:
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_HOST: localhost
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-please}
      N8N_USER_FOLDER: /home/node/.n8n
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      WEBHOOK_URL: http://localhost:5678/
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  # ==========================================================================
  # Testing & Diagnostics
  # ==========================================================================

  # Self-hosted request echo (local stand-in for postman-echo.com), reachable
  # through the gateway at /echo/* for verifying routing/headers without
  # depending on the internet. Reflects the full request back as JSON.
  echo:
    image: mendhak/http-https-echo:31
    container_name: shift_echo
    environment:
      - HTTP_PORT=8080
    networks:
      - backend
      - dev_backend
    restart: unless-stopped

  # ==========================================================================
  # Gateway (APISIX)
  # ==========================================================================

  apisix:
    image: apache/apisix:3.18.0-debian
    container_name: shift_apisix
    restart: always
    volumes:
      - ./gateway/apisix_conf/apisix-standalone.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./gateway/apisix_conf/config-standalone.yaml:/usr/local/apisix/conf/config.yaml:ro
    environment:
      - APISIX_STAND_ALONE=true
    ports:
      - "9180:9180/tcp"
      - "80:9080/tcp"
      - "9091:9091/tcp"
      - "443:9443/tcp"
      - "9092:9092/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
      - dev_backend

networks:
  backend:
    driver: bridge
    external:
      true
  dev_backend:
    external: true
    name: dev_backend
volumes:
  postgres_data:
  n8n_data:
