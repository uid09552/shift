server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Declare UTF-8 on served text instead of relying on the <meta charset>
    # fallback, so umlauts in the markup can't be misdecoded.
    charset utf-8;
    charset_types text/html text/css application/javascript application/json;

    # API proxy - forward to backend on host
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve SPA under /planner/ — ^~ gives priority over regex locations
    location ^~ /planner/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /planner/index.html;
    }

    # Redirect root to /planner/
    location = / {
        return 302 /planner/;
    }
}
