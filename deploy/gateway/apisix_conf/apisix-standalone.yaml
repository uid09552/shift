# NOTE: This configuration uses static OAuth2 credentials defined in
# deploy/iam/hydra/config/hydra.yml under oauth2.clients
#

routes:
  # ===========================================
  # Root redirect
  # ===========================================
  
  # Redirect exact / to /planner
  - uri: /
    name: root-redirect
    priority: 5
    plugins:
      redirect:
        http_status: 302
        uri: /planner/

  # ===========================================
  # Hydra OAuth2/OIDC routes (bypass OIDC)
  # ===========================================
  
  # OpenID Connect discovery endpoint
  - uri: /.well-known/*
    name: hydra-wellknown
    priority: 100
    upstream:
      type: roundrobin
      nodes:
        hydra:4444: 1

  # OAuth2 endpoints (authorize, token, revoke, etc.)
  - uri: /oauth2/*
    name: hydra-oauth2
    priority: 100
    upstream:
      type: roundrobin
      nodes:
        hydra:4444: 1

  # OIDC specific endpoints
  - uri: /oidc/*
    name: hydra-oidc
    priority: 100
    upstream:
      type: roundrobin
      nodes:
        hydra:4444: 1

  # ===========================================
  # Kratos Identity Management routes (bypass OIDC)
  # ===========================================
  
  # Kratos public API
  - uri: /kratos/*
    name: kratos-public
    priority: 100
    upstream:
      type: roundrobin
      nodes:
        kratos:4433: 1
  - uri: /consent/*
    name: kratos-selfservice
    priority: 100
    upstream:
      type: roundrobin
      nodes:       
        hydra:4444: 1
  # Self-service flows
  - uri: /self-service/*
    name: kratos-selfservice
    priority: 100
    upstream:
      type: roundrobin
      nodes:
        kratos:4433: 1

  # Identity management
  - uri: /identities/*
    name: kratos-identities
    priority: 100
    upstream:
      type: roundrobin
      nodes:
        kratos:4433: 1

  # Session management
  - uri: /sessions/*
    name: kratos-sessions
    priority: 100
    upstream:
      type: roundrobin
      nodes:
        kratos:4433: 1

  # ===========================================
  # Kratos Self-Service UI routes (bypass OIDC)
  # ===========================================
  
  # Login with login_challenge goes to consent app (OAuth2 flow)
  - uri: /login
    name: oauth2-login
    priority: 150
    vars:
      - - arg_login_challenge
        - "!"
        - "=="
        - ""
    upstream:
      type: roundrobin
      nodes:
        consent:3000: 1

  # Regular login goes to Kratos UI
  - uri: /login
    name: kratos-ui-login
    priority: 100
    upstream:
      type: roundrobin
      nodes:
        kratos-ui:4455: 1

  - uri: /assets
    name: kratos-ui-assets
    priority: 100
    upstream:
      type: roundrobin
      nodes:
        kratos-ui:4455: 1

  - uri: /registration
    name: kratos-ui-reg
    priority: 100
    upstream:
      type: roundrobin
      nodes:
        kratos-ui:4455: 1

  - uri: /settings
    name: kratos-ui-settings
    priority: 100
    upstream:
      type: roundrobin
      nodes:
        kratos-ui:4455: 1

  - uri: /recovery
    name: kratos-ui-recovery
    priority: 100
    upstream:
      type: roundrobin
      nodes:
        kratos-ui:4455: 1

  - uri: /verification
    name: kratos-ui-verify
    priority: 100
    upstream:
      type: roundrobin
      nodes:
        kratos-ui:4455: 1

  - uri: /error
    name: kratos-ui-error
    priority: 100
    upstream:
      type: roundrobin
      nodes:
        kratos-ui:4455: 1

  - uri: /consent
    name: oauth2-consent
    priority: 100
    upstream:
      type: roundrobin
      nodes:
        consent:3000: 1
  - uri: /logout
    name: kratos-ui-logout
    priority: 100
    upstream:
      type: roundrobin
      nodes:
        kratos-ui:4455: 1

  # ===========================================
  # Protected UI routes (OIDC authentication)
  # ===========================================
  
  # Planner UI - protected by OIDC
  # Static credentials from hydra.yml oauth2.clients
  - uri: /planner/*
    name: planner-ui-oidc
    priority: 10
    plugins:
      openid-connect:
        client_id: apisix-gateway-client
        client_secret: apisix-gateway-secret-change-me-in-production
        discovery: http://hydra:4444/.well-known/openid-configuration
        scope: "openid profile email"
        bearer_only: false
        redirect_uri: http://localhost/callback
        post_logout_redirect_uri: http://localhost/
        session:
          secret: geheimgeheimgeheimgeheim12345678
    upstream:
      type: roundrobin
      nodes:
        planner-ui:80: 1

  # ===========================================
  # Protected API routes (OIDC authentication)
  # ===========================================
  
  # API routes protected by Hydra OIDC
  # Static credentials from hydra.yml oauth2.clients
  - uri: /api/*
    name: api-oidc
    priority: 10
    plugins:
      openid-connect:
        client_id: apisix-gateway-client
        client_secret: apisix-gateway-secret-change-me-in-production
        discovery: http://hydra:4444/.well-known/openid-configuration
        scope: "openid profile email"
        bearer_only: false
        redirect_uri: http://localhost/callback
        post_logout_redirect_uri: http://localhost/
        session:
          secret: geheimgeheimgeheimgeheim12345678
    upstream:
      type: roundrobin
      nodes:
        backend:8080: 1

#END

