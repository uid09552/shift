      example:
        uri: /.well-known/openid-configuration
        upstream:
          type: roundrobin
          nodes:
            zitadel-api:8080: 1
    create_route_-_ui-admin:
      type: object
      properties:
        uri:
          type: string
        upstream:
          type: object
          properties:
            type:
              type: string
            nodes:
              type: object
              properties:
                zitadel-api:8080:
                  type: integer
      example:
        uri: /ui/console/*
        upstream:
          type: roundrobin
          nodes:
            zitadel-api:8080: 1
    create_route_-_zitadel-grp:
      type: object
      properties:
        uris:
          type: array
          items:
            type: string
        name:
          type: string
        upstream:
          type: object
          properties:
            type:
              type: string
            nodes:
              type: object
              properties:
                zitadel-api:8080:
                  type: integer
      example:
        uris:
          - ~^/zitadel*
        name: zitadel-auth-regex
        upstream:
          type: roundrobin
          nodes:
            zitadel-api:8080: 1
    create_route_-_zitadel-rest:
      type: object
      properties:
        uris:
          type: array
          items:
            type: string
        name:
          type: string
        upstream:
          type: object
          properties:
            type:
              type: string
            nodes:
              type: object
              properties:
                zitadel-api:8080:
                  type: integer
      example:
        uris:
          - /zitadel/*
        name: zitadel-auth-regex
        upstream:
          type: roundrobin
          nodes:
            zitadel-api:8080: 1
    create_route_-_zitadel-ui:
      type: object
      properties:
        uri:
          type: string
        upstream:
          type: object
          properties:
            type:
              type: string
            nodes:
              type: object
              properties:
                zitadel-login:3000:
                  type: integer
      example:
        uri: /ui/v2/login/*
        upstream:
          type: roundrobin
          nodes:
            zitadel-login:3000: 1
    create_route:
      type: object
      properties:
        uri:
          type: string
        plugins:
          type: object
          properties:
            openid-connect:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                discovery:
                  type: string
                scope:
                  type: string
                bearer_only:
                  type: boolean
                redirect_uri:
                  type: string
                session:
                  type: object
                  properties:
                    secret:
                      type: string
        upstream:
          type: object
          properties:
            type:
              type: string
            nodes:
              type: object
              properties:
                httpbin.org:80:
                  type: integer
      example:
        uri: /api
        plugins:
          openid-connect:
            client_id: '371188689679679491'
            client_secret: dAMeHN0c5nicPcopFosqAYPWOxQheloEBkHERg25ApcU6G5eIO4OuJbUdgNBIbnH
            discovery: http://localhost:8080/.well-known/openid-configuration
            scope: openid
            bearer_only: false
            redirect_uri: https://httpbin.org/get
            session:
              secret: geheimgeheimgeheimgeheim
        upstream:
          type: roundrobin
          nodes:
            httpbin.org:80: 1
