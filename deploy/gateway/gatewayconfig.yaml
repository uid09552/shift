components:
  schemas:
    create_route_-_iam-ui:
      type: object
      properties:
        uri:
          type: string
        name:
          type: string
        priority:
          type: integer
        plugins:
          type: object
          properties:
            proxy-rewrite:
              type: object
              properties:
                regex_uri:
                  type: array
                  items:
                    type: string
        upstream:
          type: object
          properties:
            scheme:
              type: string
            type:
              type: string
            nodes:
              type: object
              properties:
                zitadel-api:8080:
                  type: integer
      example:
        uri: /iam/*
        name: zitadel-grpc
        priority: 10
        plugins:
          proxy-rewrite:
            regex_uri:
              - ^/iam/(.*)
              - /$1
        upstream:
          scheme: grpc
          type: roundrobin
          nodes:
            zitadel-api:8080: 1
    create_route_-_ui-admin_1:
      type: object
      properties:
        uri:
          type: string
        upstream:
          type: object
          properties:
            type:
              type: string
            nodes:
              type: object
              properties:
                zitadel-api:8080:
                  type: integer
      example:
        uri: /ui/console/*
        upstream:
          type: roundrobin
          nodes:
            zitadel-api:8080: 1
    create_route_-_ui-admin_2:
      type: object
      properties:
        uri:
          type: string
        upstream:
          type: object
          properties:
            type:
              type: string
            nodes:
              type: object
              properties:
                zitadel-api:8080:
                  type: integer
      example:
        uri: /.well-known/openid-configuration
        upstream:
          type: roundrobin
          nodes:
            zitadel-api:8080: 1
    create_route_-_ui-admin_3:
      type: object
      properties:
        uri:
          type: string
        upstream:
          type: object
          properties:
