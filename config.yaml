server:
  port: 8080
  listen: "127.0.0.1"
  verbose: false

database:
  url: "postgresql://postgres:postgres@localhost:5432/shift"

broker:
  host: "127.0.0.1"
  port: 4222

optimizer:
  url: "http://localhost:8888"

# Keycloak admin connection, used only by the user-management endpoints
# (/api/v1/users). Leave `url` empty to turn user management off — the server
# still starts and those endpoints answer 503.
# `client_id` must be a confidential client whose service account holds the
# realm-management roles; the shipped realm grants them to shift-gateway
# (deploy/iam/realm-shift.json).
keycloak:
  url: ""                       # e.g. http://localhost:8080/auth (or http://keycloak:8080/auth in compose)
  realm: "shift"
  client_id: "shift-gateway"
  client_secret: ""             # SHIFT_KEYCLOAK__CLIENT_SECRET in a real deployment

# OpenTelemetry export. Off while `endpoint` is empty and
# OTEL_EXPORTER_OTLP_ENDPOINT is unset; every field below falls back to its
# standard OTEL_* (or GitLab CI_*) environment variable.
otel:
  # gRPC: https://<project>.otel.gitlab-o11y.com:14317
  # HTTP: https://<project>.otel.gitlab-o11y.com:14318
  endpoint: ""
  protocol: "grpc"      # grpc | http
  headers: ""           # "key=value,key2=value2" — e.g. the collector's auth token
  service_name: "shift-backend"
  service_version: ""   # CI_COMMIT_SHA
  environment: ""       # CI_ENVIRONMENT_NAME
  gitlab_project_id: "" # CI_PROJECT_ID
  gitlab_project_name: "" # CI_PROJECT_NAME
  sample_ratio: 1.0

# Access-token verification (signature, expiry, issue date) against Keycloak's JWKS.
# Without jwks_url it is derived from keycloak.url + realm; with neither, every
# request is refused outside dev mode.
auth:
  jwks_url: "http://keycloak:8080/auth/realms/shift/protocol/openid-connect/certs"

# Public holidays, fetched as JSON from api-feiertage.de and stored per tenant.
# A holiday runs on a shift's Sunday times and counts as a weekend day.
# Env: SHIFT_HOLIDAYS__ENABLED, SHIFT_HOLIDAYS__URL, SHIFT_HOLIDAYS__STATE.
holidays:
  enabled: true
  url: "https://get.api-feiertage.de"
  state: "by"          # two-letter German state code

# What GET /api/v1/info reports. Leave empty to report what the build baked in
# (APP_VERSION / GIT_COMMIT / BUILD_DATE, set by GitLab CI as Docker build
# arguments); a local build without them reports the crate version.
# Env: SHIFT_BUILD__VERSION, SHIFT_BUILD__COMMIT, SHIFT_BUILD__DATE.
build:
  version: ""
  commit: ""
  date: ""
